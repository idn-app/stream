<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>[LIVE] JKT48 Theater by Gemes.in</title>
<link href="https://www.idn.app/img/logo-idn.png" rel="icon" type="image/x-icon">
<link href="https://cdn.vidstack.io/player/theme.css" rel="stylesheet">
<link href="https://cdn.vidstack.io/player/video.css" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #14171a; color: #d1d5db;
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { background: #2c2e31; border-bottom: 1px solid #374151; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
  header img { height: 26px; }
  header h1 { font-size: 14px; font-weight: 700; margin: 0; color: #e5e7eb; }
  main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  media-player { width: 100%; max-width: 1100px; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
  .pesan { max-width: 640px; text-align: center; line-height: 1.6; }
  .pesan b { color: #e5e7eb; }
  footer { padding: 10px 20px 18px; font-size: 11px; color: #6b7280; text-align: center; }
</style>
</head>
<body>
<header>
  <img src="https://www.idn.app/img/logo-idn.png" alt="">
  <h1>JKT48 Theater — Gemes.in</h1>
</header>
<main id="isi">
  <div class="pesan">Memuat siaran…</div>
</main>
<footer>Mode cadangan. Kalau ada kendala, hubungi admin.</footer>

<script type="module" src="https://cdn.jsdelivr.net/npm/@vidstack/cdn@1.15.6/player.js"></script>
<script>
  // Halaman cadangan: dipakai kalau siaran IDN tidak bisa diputar dan admin
  // mengarahkan link pembeli ke YouTube lewat /addstreamlink.
  // Link: /player/yt.html?v=<videoId>&inv=<invoice>
  // Pemutar pakai Vidstack (provider YouTube) supaya tampilannya sama dengan player utama.
  const params = new URLSearchParams(location.search);
  const videoId = (params.get("v") || "").trim();
  const isi = document.getElementById("isi");

  if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
    isi.innerHTML = '<div class="pesan"><b>Link tidak lengkap.</b><br>Minta link baru ke admin ya.</div>';
  } else {
    const player = document.createElement("media-player");
    player.setAttribute("src", "youtube/" + videoId);
    player.setAttribute("title", "JKT48 Theater");
    player.setAttribute("controls", "");
    player.setAttribute("playsinline", "");
    player.setAttribute("crossorigin", "");
    player.innerHTML = '<media-provider></media-provider><media-video-layout></media-video-layout>';

    player.addEventListener("can-play", () => { player.play().catch(() => {}); }, { once: true });
    player.addEventListener("error", (e) => {
      isi.innerHTML = '<div class="pesan"><b>Siaran cadangan tidak bisa dimuat.</b><br>' +
        'Coba muat ulang halaman, atau hubungi admin.</div>';
      console.error("[yt fallback]", e.detail);
    });

    isi.replaceChildren(player);
  }
</script>
</body>
</html>
